<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PAX TV Hospitality - Hotel TV Application">

  <!-- TV Display Optimizations -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PAX TV">

  <!-- Favicon & webOS Launcher Icons -->
  <link rel="icon" type="image/png" href="icon.png"/>
  <title>PAX TV Hospitality</title>
  <link rel="manifest" href="manifest.json">

  <!-- webOS TV SDK -->
  <script src="webOSTVjs-1.2.13/webOSTV.js" charset="utf-8"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #08030D;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Hardware Acceleration Container */
    #flutter_host {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* Instant Native TV Splash Screen */
    #tv-splash-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b0a2a 0%, #08030d 100%);
      z-index: 999999;
      pointer-events: none;
      will-change: opacity;
    }

    .ambient-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(0,0,0,0) 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .tv-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #f59e0b;
      border-right-color: #fbbf24;
      animation: tv-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .tv-ring-reverse {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #e11d48;
      border-left-color: #a855f7;
      animation: tv-spin-rev 0.8s linear infinite;
    }

    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }

    .logo-badge img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .splash-title {
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .splash-subtitle {
      color: #f59e0b;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0;
      opacity: 0.9;
    }

    @keyframes tv-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes tv-spin-rev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>

  <!-- Instant 0-Second TV Splash Screen -->
  <div id="tv-splash-screen">
    <div class="ambient-glow"></div>
    <div class="logo-container">
      <div class="tv-ring"></div>
      <div class="tv-ring-reverse"></div>
      <div class="logo-badge">
        <img src="assets/logo.png" alt="PAX TV" onerror="this.style.display='none'">
      </div>
    </div>
    <h1 class="splash-title">PAX Hospitality TV</h1>
    <p class="splash-subtitle">Optimizing TV Environment...</p>
  </div>

  <!-- LG webOS Remote Control Bridge -->
  <script>
    // webOS Back button handler (keyCode 461 / 0x1CD)
    window.addEventListener('keydown', function(event) {
      var code = event.keyCode || event.which;
      if (code === 461) {
        // Synthesize Escape/Back event for Flutter framework
        var syntheticEvent = new KeyboardEvent('keydown', {
          bubbles: true,
          cancelable: true,
          key: 'Escape',
          code: 'Escape',
          keyCode: 27,
          which: 27
        });
        window.dispatchEvent(syntheticEvent);
        document.dispatchEvent(syntheticEvent);

        // Also check if history can pop
        if (window.history.length > 1) {
          window.history.back();
        }
      }
    }, true);
  </script>

  <!-- High-Performance Flutter Web Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Smooth transition when Flutter Engine loads
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('tv-splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.4s ease';
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
    });

    // Fallback timer: remove splash after 5s max so TV is never permanently stuck
    setTimeout(function() {
      var splash = document.getElementById('tv-splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.4s ease';
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
    }, 5000);
  </script>
</body>
</html>
