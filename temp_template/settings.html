<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login</title>
    <style>
                        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #app-canvas {
            width: 1920px;
            height: 1080px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center center;
            overflow: hidden;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="css/global.css">
    <!-- PAGE CSS -->
    <link rel="stylesheet" href="css/pages/settings.css">

    <!-- CORE JS -->
    <script src="js/bridge.js" defer></script>
    <script src="js/core/tv-core.js" defer></script>
    <script src="js/core/tv-navigation.js" defer></script>
    
    <!-- PAGE JS -->
    <script src="js/pages/settings.js" defer></script>
</head>
<body class="page-centered">
  <div id="app-canvas">
    <div id="bg-slider">
        <div class="slide active"></div>
        <div class="slide"></div>
    </div>

    <button id="backBtn" class="back-btn-pill" tabindex="0" onclick="window.location.href='index.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> BACK
    </button>

    <div class="login-card">
        <div class="login-title">ADMIN ACCESS</div>
        <div id="passDisplay">******</div>
        <div class="num-grid" id="keypad">
            <button class="num-btn focusable" tabindex="0" data-val="1">1</button>
            <button class="num-btn focusable" tabindex="0" data-val="2">2</button>
            <button class="num-btn focusable" tabindex="0" data-val="3">3</button>
            <button class="num-btn focusable" tabindex="0" data-val="4">4</button>
            <button class="num-btn focusable" tabindex="0" data-val="5">5</button>
            <button class="num-btn focusable" tabindex="0" data-val="6">6</button>
            <button class="num-btn focusable" tabindex="0" data-val="7">7</button>
            <button class="num-btn focusable" tabindex="0" data-val="8">8</button>
            <button class="num-btn focusable" tabindex="0" data-val="DEL">⌫</button>
            <button class="num-btn focusable" tabindex="0" data-val="9">9</button>
            <button class="num-btn focusable" tabindex="0" data-val="0">0</button>
            <button class="num-btn focusable" tabindex="0" data-val="ESC">ESC</button>
        </div>
    </div>
  </div>

  <script>
        function fitScreen() {
      const canvas = document.getElementById('app-canvas');
      if (!canvas) return;
      const targetWidth = 1920;
      const targetHeight = 1080;

      const currentWidth = window.innerWidth;
      const currentHeight = window.innerHeight;

      const scaleX = currentWidth / targetWidth;
      const scaleY = currentHeight / targetHeight;
      const scale = Math.min(scaleX, scaleY);

      canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', fitScreen);
    window.addEventListener('DOMContentLoaded', fitScreen);
    fitScreen();
  </script>
</body>
</html>
